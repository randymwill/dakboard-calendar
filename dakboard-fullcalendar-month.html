<!doctype html>
<!--
DAKboard Family Dashboard
Version: v1.15.0

v1.15.0 cleanup/stabilization:
- Rebuilt single-file layout around explicit calendar/sidebar/weather/traffic regions
- Meals footer lives inside the calendar column and pixel-locks to FullCalendar headers
- Christmas countdown is live and independent of holiday mode
- Sidebar Status shows version and last refresh
- Weather card rebuilt in a richer iOS-inspired style using Open-Meteo Fahrenheit data
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DAKboard Family Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
  <script src="https://unpkg.com/ical.js/dist/ical.es5.min.cjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.19/index.global.min.js"></script>

  <style>
    :root {
      --TOP_VH: 67;
      --BOTTOM_VH: 33;
      --sidebar-width: 360px;
      --gap: 14px;
      --pad: 14px;

      --bg: #07111d;
      --panel: #0d1a2b;
      --panel-deep: #07101c;
      --line: rgba(255,255,255,0.16);
      --line-strong: rgba(255,255,255,0.28);
      --text: rgba(255,255,255,0.94);
      --muted: rgba(255,255,255,0.62);
      --faint: rgba(255,255,255,0.42);

      --school: #ef4444;
      --sports: #ec4899;
      --other: #22d3ee;
      --randy: #3b82f6;
      --leslie: #22c55e;
      --today: #38bdf8;
      --meal-bg: rgba(255,255,255,0.055);
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
    }

    body {
      background:
        radial-gradient(1100px 700px at 18% -8%, rgba(34,211,238,0.13), transparent 62%),
        radial-gradient(900px 620px at 86% 114%, rgba(236,72,153,0.10), transparent 56%),
        linear-gradient(180deg, #081423 0%, #040912 100%);
    }

    #screen-grid {
      height: 100vh;
      display: grid;
      grid-template-rows: calc(var(--TOP_VH) * 1vh) calc(var(--BOTTOM_VH) * 1vh);
      gap: 0;
    }

    #top-area,
    #bottom-area {
      min-height: 0;
      padding: var(--pad);
    }

    #calendar-card {
      height: 100%;
      min-height: 0;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(13,26,43,0.96), rgba(7,16,28,0.97));
      box-shadow: 0 18px 60px rgba(0,0,0,0.44);
    }

    #main-row {
      height: 100%;
      min-height: 0;
      display: flex;
      gap: 12px;
      padding: 10px;
    }

    #left-col {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #calendar {
      flex: 1 1 auto;
      min-height: 0;
    }

    #sidebar {
      flex: 0 0 var(--sidebar-width);
      min-width: 320px;
      max-width: 430px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .side-card {
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 8px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(0,0,0,0.13));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
    }

    .side-card.grow {
      flex: 1 1 auto;
    }

    .side-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .side-title strong {
      font-size: 1.04em;
      letter-spacing: 0.01em;
    }

    .side-title span {
      color: var(--muted);
      font-size: 0.82em;
      font-weight: 750;
      white-space: nowrap;
    }

    .side-sub {
      color: rgba(255,255,255,0.74);
      font-weight: 760;
      line-height: 1.28;
      margin-bottom: 14px;
    }

    .side-section {
      margin-top: 12px;
    }

    .side-section-title {
      color: var(--faint);
      font-size: 0.72em;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .side-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .side-item {
      display: flex;
      gap: 9px;
      min-width: 0;
      padding: 8px 9px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.18);
    }

    .dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      margin-top: 5px;
      border-radius: 999px;
      background: var(--other);
    }

    .side-lines {
      min-width: 0;
    }

    .line1,
    .line2 {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .line1 {
      font-size: 0.9em;
      font-weight: 820;
    }

    .line2 {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.78em;
      font-weight: 720;
    }

    #side-status-version {
      margin: 0;
      color: rgba(255,255,255,0.80);
    }

    .status-line {
      margin-bottom: 4px;
    }

    #bottom-area {
      display: grid;
      grid-template-columns: 30% 40% 30%;
      gap: var(--gap);
      align-items: stretch;
    }

    #bottom-spacer { min-width: 0; }

    .bottom-panel {
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 8px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.40);
    }

    .fc,
    .fc .fc-view-harness,
    .fc .fc-view-harness-active {
      height: 100% !important;
    }

    .fc .fc-header-toolbar {
      margin: 8px 8px 6px;
    }

    .fc .fc-toolbar-title {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,0.92);
      font-size: 1.28em;
      font-weight: 760;
      letter-spacing: 0;
    }

    .title-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      background: rgba(0,0,0,0.24);
      color: rgba(255,255,255,0.88);
      font-size: 0.72em;
      font-weight: 850;
      white-space: nowrap;
    }

    .title-chip .muted { color: rgba(255,255,255,0.68); }

    .fc-theme-standard td,
    .fc-theme-standard th,
    .fc-theme-standard .fc-scrollgrid {
      border-color: var(--line);
    }

    .fc .fc-col-header-cell {
      border-color: var(--line-strong) !important;
      background: rgba(255,255,255,0.035);
    }

    .fc .fc-col-header-cell-cushion {
      padding: 9px 0;
      color: var(--muted);
      font-size: 0.95em;
      font-weight: 760;
      text-decoration: none;
    }

    .fc .fc-daygrid-body,
    .fc .fc-daygrid-body table {
      height: 100%;
    }

    .fc .fc-daygrid-day {
      height: calc(100% / 4);
      background: rgba(255,255,255,0.015);
    }

    .fc .fc-day-sun,
    .fc .fc-day-sat {
      background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015));
    }

    .fc .fc-daygrid-day-frame {
      min-height: 100%;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.045);
    }

    .fc .fc-daygrid-day-number {
      padding: 6px 8px 4px;
      color: var(--muted);
      font-size: 0.78em;
      font-weight: 750;
      text-decoration: none;
    }

    .fc .fc-day-today {
      background: linear-gradient(180deg, rgba(56,189,248,0.12), rgba(56,189,248,0.025)) !important;
    }

    .fc .fc-day-today .fc-daygrid-day-frame {
      box-shadow: inset 0 0 0 2px rgba(56,189,248,0.75);
    }

    .fc .holiday-date .fc-daygrid-day-frame {
      box-shadow:
        inset 0 0 0 2px rgba(250,204,21,0.45),
        inset 0 22px 32px rgba(250,204,21,0.06);
    }

    .fc .holiday-date::before {
      content: attr(data-holiday-label);
      position: absolute;
      top: 8px;
      right: 10px;
      z-index: 2;
      max-width: calc(100% - 62px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.13);
      background: rgba(0,0,0,0.30);
      color: rgba(255,255,255,0.80);
      font-size: 0.68em;
      font-weight: 830;
    }

    .fc .fc-daygrid-event {
      border: 0;
      border-radius: 6px;
      margin: 2px 4px 0;
      padding: 4px 7px;
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 4px 12px rgba(0,0,0,0.18);
    }

    .fc .fc-daygrid-event.event-school { background: var(--school); }
    .fc .fc-daygrid-event.event-sports { background: var(--sports); }
    .fc .fc-daygrid-event.event-other { background: var(--other); }
    .fc .fc-daygrid-event.event-randy { background: var(--randy); }
    .fc .fc-daygrid-event.event-leslie { background: var(--leslie); }

    .fc .evt {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
      white-space: nowrap;
    }

    .fc .evt-icon,
    .fc .evt-time,
    .fc .evt-title {
      position: relative;
      z-index: 1;
    }

    .fc .evt-icon {
      flex: 0 0 auto;
      font-size: 1.06em;
      line-height: 1;
    }

    .fc .evt-time {
      flex: 0 0 auto;
      font-size: 0.82em;
      font-weight: 850;
      opacity: 0.94;
    }

    .fc .evt-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.98em;
      font-weight: 760;
      line-height: 1.12;
    }

    .fc .evt-past-today {
      opacity: 0.42;
      filter: saturate(0.8);
    }

    .day-chip {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 3;
      max-width: calc(100% - 16px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.30);
      color: rgba(255,255,255,0.88);
      font-size: 0.68em;
      font-weight: 880;
      pointer-events: none;
    }

    .day-chip .muted { color: rgba(255,255,255,0.68); }

    #meals-footer {
      flex: 0 0 auto;
      width: 100%;
      overflow: hidden;
      padding: 7px 0 0;
      border-top: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(0,0,0,0.13));
    }

    #meals-footer.hidden { display: none !important; }

    #meals-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0;
      align-items: stretch;
    }

    .meal-col {
      min-width: 0;
      min-height: 54px;
      margin: 0 4px 8px;
      padding: 8px 8px 7px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 7px;
      background: var(--meal-bg);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .meal-col.empty {
      visibility: hidden;
      pointer-events: none;
      border-color: transparent !important;
      background: transparent !important;
      box-shadow: none !important;
    }

    .meal-row {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-width: 0;
    }

    .meal-row + .meal-row { margin-top: 5px; }

    .meal-pill {
      flex: 0 0 auto;
      min-width: 26px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.22);
      text-align: center;
      font-size: 0.76em;
      line-height: 1.2;
    }

    .meal-main {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: rgba(255,255,255,0.88);
      font-size: 0.80em;
      font-weight: 790;
      line-height: 1.18;
    }

    .meal-lunch {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
      line-height: 1.15;
    }

    .meal-entrees,
    .meal-sides {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meal-entrees {
      -webkit-line-clamp: 2;
      color: rgba(255,255,255,0.90);
      font-size: 0.80em;
      font-weight: 800;
    }

    .meal-sides {
      -webkit-line-clamp: 2;
      color: rgba(255,255,255,0.62);
      font-size: 0.74em;
      font-weight: 720;
    }

    #weather-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px;
      background:
        radial-gradient(120% 110% at 26% 0%, rgba(95,180,255,0.30) 0%, rgba(25,65,108,0.24) 36%, transparent 67%),
        linear-gradient(145deg, rgba(16,38,64,0.96), rgba(8,13,29,0.97) 56%, rgba(14,26,45,0.97));
    }

    #weather-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 32%);
      opacity: 0.7;
    }

    #weather-panel > * {
      position: relative;
      z-index: 1;
    }

    #weather-now {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
    }

    .wx-city {
      color: rgba(255,255,255,0.90);
      font-size: 1.18em;
      font-weight: 800;
      line-height: 1.1;
    }

    .wx-temp {
      margin-top: 2px;
      font-size: 4.5em;
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: 0;
    }

    .wx-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }

    .wx-chip {
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.78);
      font-size: 0.72em;
      font-weight: 750;
      white-space: nowrap;
    }

    .wx-now-right {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      text-align: right;
    }

    .wx-big-icon {
      font-size: 2.55em;
      line-height: 1;
    }

    .wx-cond {
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 850;
    }

    .wx-hilo {
      color: rgba(255,255,255,0.76);
      font-size: 0.88em;
      font-weight: 760;
    }

    #weather-hourly {
      display: flex;
      gap: 8px;
      padding: 10px 0;
      border-top: 1px solid rgba(255,255,255,0.13);
      border-bottom: 1px solid rgba(255,255,255,0.13);
    }

    .wx-hour {
      flex: 1 1 0;
      min-width: 0;
      padding: 8px 5px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px;
      background: rgba(255,255,255,0.055);
      text-align: center;
    }

    .wx-hour .time {
      color: rgba(255,255,255,0.68);
      font-size: 0.72em;
      font-weight: 830;
    }

    .wx-hour .icon {
      margin: 5px 0 3px;
      font-size: 1.22em;
      line-height: 1;
    }

    .wx-hour .temp {
      font-size: 0.94em;
      font-weight: 900;
    }

    #weather-forecast {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 0;
    }

    .wx-day {
      display: grid;
      grid-template-columns: 48px 32px 1fr;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 8px 9px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px;
      background: rgba(255,255,255,0.048);
    }

    .wx-day .day {
      font-size: 0.78em;
      font-weight: 900;
    }

    .wx-day .icon {
      text-align: center;
      font-size: 1.15em;
    }

    .wx-range {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .wx-low,
    .wx-high {
      width: 34px;
      font-size: 0.80em;
      font-weight: 850;
    }

    .wx-low {
      color: rgba(255,255,255,0.58);
      text-align: right;
    }

    .wx-high { color: rgba(255,255,255,0.90); }

    .wx-bar {
      position: relative;
      flex: 1 1 auto;
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,0.11);
    }

    .wx-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #5aa7ff, #7df0d2, #ffd166);
    }

    #traffic-panel {
      position: relative;
      background: #08111d;
    }

    #traffic-panel iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #traffic-label {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      padding: 5px 10px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      background: rgba(0,0,0,0.44);
      color: rgba(255,255,255,0.82);
      font-size: 0.72em;
      font-weight: 780;
      backdrop-filter: blur(3px);
    }

    .load-note {
      color: rgba(255,255,255,0.66);
      font-size: 0.85em;
      font-weight: 760;
    }

    @media (min-width: 3000px) {
      body { font-size: 24px; }
      :root { --sidebar-width: 520px; --pad: 18px; --gap: 18px; }
      .fc .fc-toolbar-title { font-size: 1.38em; }
      .fc .evt-title { font-size: 1.02em; }
      .meal-col { min-height: 76px; padding: 11px 10px 10px; }
      .wx-temp { font-size: 4.9em; }
    }

    @media (max-width: 1200px) {
      #sidebar { display: none; }
      #bottom-area { grid-template-columns: 1fr 1fr; }
      #bottom-spacer { display: none; }
    }
  </style>
</head>

<body>
  <div id="screen-grid">
    <section id="top-area">
      <div id="calendar-card">
        <div id="main-row">
          <div id="left-col">
            <div id="calendar"></div>
            <div id="meals-footer">
              <div id="meals-grid" aria-label="Current week school meals"></div>
            </div>
          </div>

          <aside id="sidebar" aria-label="Today and status">
            <div class="side-card grow">
              <div class="side-title">
                <strong>Today</strong>
                <span id="today-date-label">—</span>
              </div>
              <div class="side-sub" id="today-summary">Loading…</div>

              <div class="side-section">
                <div class="side-section-title">Next Up</div>
                <div class="side-list" id="today-upcoming"></div>
              </div>

              <div class="side-section">
                <div class="side-section-title">Games</div>
                <div class="side-list" id="today-games"></div>
              </div>
            </div>

            <div class="side-card">
              <div class="side-title">
                <strong>Status</strong>
              </div>
              <div class="side-sub status-line" id="side-status-version">Version: —</div>
              <div class="side-sub status-line" id="side-last-refresh">Last refreshed: —</div>
            </div>
          </aside>
        </div>
      </div>
    </section>

    <section id="bottom-area">
      <section class="bottom-panel" id="weather-panel" aria-label="Weather">
        <div id="weather-now">
          <div>
            <div class="wx-city">Saint Louis</div>
            <div class="wx-temp" id="weather-temp">--°</div>
            <div class="wx-meta">
              <span class="wx-chip" id="weather-feels">Feels —</span>
              <span class="wx-chip" id="weather-wind">Wind —</span>
              <span class="wx-chip" id="weather-precip">Precip —</span>
              <span class="wx-chip" id="weather-updated">Updated —</span>
            </div>
          </div>
          <div class="wx-now-right">
            <div class="wx-big-icon" id="weather-icon">☁️</div>
            <div class="wx-cond" id="weather-cond">Loading…</div>
            <div class="wx-hilo" id="weather-hilo">H: --° L: --°</div>
          </div>
        </div>
        <div id="weather-hourly" aria-label="Hourly forecast">
          <div class="load-note">Loading hourly forecast…</div>
        </div>
        <div id="weather-forecast" aria-label="Daily forecast"></div>
      </section>

      <div id="bottom-spacer" aria-hidden="true"></div>

      <section class="bottom-panel" id="traffic-panel" aria-label="Traffic map">
        <div id="traffic-label">Traffic</div>
        <iframe
          id="traffic-frame"
          title="Waze live traffic"
          src="https://embed.waze.com/iframe?zoom=13&amp;lat=38.638412&amp;lon=-90.457971&amp;ct=livemap"
          allowfullscreen
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </section>
    </section>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const APP_VERSION = "v1.15.0";
      const ENABLE_HOLIDAY_MODE = false;
      const ENABLE_CHRISTMAS_COUNTDOWN = true;
      const ENABLE_GAME_COUNTDOWN_CHIPS = true;
      const AUTO_HIDE_MEALS_FOOTER = true;

      const ICS_URL = "https://snowy-silence-6676.randywilliams-us.workers.dev/";
      const MENU_URL = "https://cool-lake-2804.randywilliams-us.workers.dev/";
      const HOME_LAT = 38.654398639984805;
      const HOME_LON = -90.45877499401288;

      const AUTO_REFRESH_MINUTES = 10;
      const WEATHER_REFRESH_MINUTES = 10;
      const COUNTDOWN_LOOKAHEAD_DAYS = 14;
      const BREAKFAST_MAX_ITEMS = 2;
      const LUNCH_MAX_ENTREES = 3;

      const els = {
        calendar: document.getElementById("calendar"),
        mealsFooter: document.getElementById("meals-footer"),
        mealsGrid: document.getElementById("meals-grid"),
        todayDate: document.getElementById("today-date-label"),
        todaySummary: document.getElementById("today-summary"),
        todayUpcoming: document.getElementById("today-upcoming"),
        todayGames: document.getElementById("today-games"),
        sideRefresh: document.getElementById("side-last-refresh"),
        sideVersion: document.getElementById("side-status-version")
      };

      if (!ENABLE_HOLIDAY_MODE) {
        document.documentElement.classList.remove("holiday-mode");
      }

      setVersionDisplays();
      setLastRefreshed("loaded");

      const rules = {
        randy: /randy/i,
        leslie: /leslie/i,
        school: /school|dismissal|class|winter break|no school|mason ridge|party/i,
        basketball: /basketball|bball|little dribblers/i,
        soccer: /soccer|rainbow unicorns/i,
        rainbowUnicorns: /rainbow unicorns/i
      };

      function setVersionDisplays() {
        if (els.sideVersion) {
          els.sideVersion.innerHTML = `Version: <strong>${APP_VERSION}</strong>`;
        }
      }

      function setLastRefreshed(reason) {
        const text = formatLocalTime(new Date());
        if (els.sideRefresh) els.sideRefresh.textContent = `Last refreshed: ${text}`;
        if (reason) console.log(`Dashboard refreshed: ${reason}`);
      }

      function startOfCurrentWeekSunday(d = new Date()) {
        const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        date.setDate(date.getDate() - date.getDay());
        date.setHours(0, 0, 0, 0);
        return date;
      }

      function addDays(date, days) {
        const d = new Date(date);
        d.setDate(d.getDate() + days);
        return d;
      }

      function startOfDay(date) {
        const d = new Date(date);
        d.setHours(0, 0, 0, 0);
        return d;
      }

      function sameDay(a, b) {
        return a && b &&
          a.getFullYear() === b.getFullYear() &&
          a.getMonth() === b.getMonth() &&
          a.getDate() === b.getDate();
      }

      function toYYYYMMDD(date) {
        const d = date instanceof Date ? date : new Date(date);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }

      function menuDateKey(value) {
        if (!value) return null;
        if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
        const d = new Date(value);
        return Number.isNaN(d.getTime()) ? null : toYYYYMMDD(d);
      }

      function formatLocalTime(dt) {
        return dt.toLocaleString([], { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" });
      }

      function formatPrettyDate(dt) {
        return dt.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
      }

      function formatTime(dt) {
        return dt.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function classifyEvent(title) {
        const t = title || "";
        if (rules.randy.test(t)) return { category: "randy", icon: "" };
        if (rules.leslie.test(t)) return { category: "leslie", icon: "" };
        if (rules.basketball.test(t)) return { category: "sports", icon: "🏀", sport: "basketball" };
        if (rules.soccer.test(t)) {
          return { category: "sports", icon: rules.rainbowUnicorns.test(t) ? "🌈🦄⚽" : "⚽", sport: "soccer" };
        }
        if (rules.school.test(t)) return { category: "school", icon: "🐎" };
        return { category: "other", icon: "" };
      }

      function categoryColor(category) {
        if (category === "school") return "var(--school)";
        if (category === "sports") return "var(--sports)";
        if (category === "randy") return "var(--randy)";
        if (category === "leslie") return "var(--leslie)";
        return "var(--other)";
      }

      function holidayLabelForDate(date) {
        const m = date.getMonth() + 1;
        const d = date.getDate();
        if (m === 12 && d === 24) return "Christmas Eve";
        if (m === 12 && d === 25) return "Christmas Day";
        if (m === 12 && d === 31) return "New Year's Eve";
        return "";
      }

      function updateChristmasChip() {
        if (!ENABLE_CHRISTMAS_COUNTDOWN) return;

        const titleEl = document.querySelector(".fc-toolbar-title");
        if (!titleEl) return;

        const now = new Date();
        let christmas = new Date(now.getFullYear(), 11, 25, 0, 0, 0, 0);
        if (now > christmas) christmas = new Date(now.getFullYear() + 1, 11, 25, 0, 0, 0, 0);

        const totalSeconds = Math.max(0, Math.floor((christmas.getTime() - now.getTime()) / 1000));
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        const pad = n => String(n).padStart(2, "0");

        const existing = titleEl.querySelector(".title-chip");
        if (existing) existing.remove();

        titleEl.insertAdjacentHTML(
          "beforeend",
          `<span class="title-chip">🎄 <span class="muted">Christmas</span> ${days}d ${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s</span>`
        );
      }

      const dayChipElsByKey = new Map();
      let cachedSportsEvents = [];

      function ensureDayChip(dayEl, dateKey) {
        let chip = dayChipElsByKey.get(dateKey);
        if (chip && chip.isConnected) return chip;

        const frame = dayEl.querySelector(".fc-daygrid-day-frame") || dayEl;
        frame.style.position = "relative";
        chip = document.createElement("div");
        chip.className = "day-chip";
        chip.style.display = "none";
        frame.appendChild(chip);
        dayChipElsByKey.set(dateKey, chip);
        return chip;
      }

      function clearDayChips() {
        for (const chip of dayChipElsByKey.values()) {
          chip.style.display = "none";
        }
      }

      function shortCountdown(ms) {
        if (ms <= 0) return "now";
        const mins = Math.floor(ms / 60000);
        const hours = Math.floor(mins / 60);
        const days = Math.floor(hours / 24);
        if (days >= 1) return `${days}d`;
        if (hours >= 1) return `${hours}h`;
        return `${Math.max(1, mins)}m`;
      }

      function normalizeSportsEvents(events) {
        const now = Date.now();
        return events
          .map(event => {
            const meta = classifyEvent(event.title || "");
            if (meta.category !== "sports" || !event.start) return null;
            const end = event.end || new Date(event.start.getTime() + 60 * 60 * 1000);
            if (end.getTime() < now) return null;
            return { title: event.title, start: event.start, end, icon: meta.icon || "🏟️" };
          })
          .filter(Boolean)
          .sort((a, b) => a.start - b.start);
      }

      function updateGameDayChips(visibleStart, visibleEnd) {
        if (!ENABLE_GAME_COUNTDOWN_CHIPS) return;
        clearDayChips();

        const now = new Date();
        const horizon = addDays(startOfDay(now), COUNTDOWN_LOOKAHEAD_DAYS).getTime();
        const perDay = new Map();

        for (const event of cachedSportsEvents) {
          const startMs = event.start.getTime();
          if (startMs < now.getTime() || startMs > horizon) continue;
          if (startMs < visibleStart.getTime() || startMs >= visibleEnd.getTime()) continue;
          const key = toYYYYMMDD(event.start);
          if (!perDay.has(key)) perDay.set(key, event);
        }

        for (const [key, event] of perDay) {
          const chip = dayChipElsByKey.get(key);
          if (!chip) continue;
          chip.innerHTML = `${event.icon} <span class="muted">Game</span> in ${shortCountdown(event.start.getTime() - now.getTime())}`;
          chip.style.display = "";
        }
      }

      function renderSideList(container, items, emptyText) {
        if (!container) return;
        container.innerHTML = "";

        if (!items.length) {
          container.innerHTML = `
            <div class="side-item">
              <span class="dot" style="background:rgba(255,255,255,0.25)"></span>
              <div class="side-lines">
                <div class="line1">${escapeHtml(emptyText)}</div>
                <div class="line2">Nothing else needs attention</div>
              </div>
            </div>`;
          return;
        }

        for (const item of items) {
          container.insertAdjacentHTML("beforeend", `
            <div class="side-item">
              <span class="dot" style="background:${categoryColor(item.category)}"></span>
              <div class="side-lines">
                <div class="line1">${escapeHtml(item.line1)}</div>
                <div class="line2">${escapeHtml(item.line2)}</div>
              </div>
            </div>`);
        }
      }

      function humanWhen(dt) {
        const mins = Math.round((dt.getTime() - Date.now()) / 60000);
        if (mins <= 0) return "now";
        if (mins < 60) return `in ${mins}m`;
        const hours = Math.floor(mins / 60);
        const rem = mins % 60;
        if (hours < 24) return `in ${hours}h ${rem}m`;
        const days = Math.floor(hours / 24);
        return `in ${days}d ${hours % 24}h`;
      }

      function buildSidebar(calendar) {
        const sidebar = document.getElementById("sidebar");
        if (!sidebar || getComputedStyle(sidebar).display === "none") return;

        const now = new Date();
        const todayStart = startOfDay(now);
        const tomorrowStart = addDays(todayStart, 1);
        if (els.todayDate) els.todayDate.textContent = formatPrettyDate(now);

        const todays = [];
        const future = [];
        const games = [];

        for (const event of calendar.getEvents()) {
          if (!event.start) continue;
          const end = event.end || new Date(event.start.getTime() + 60 * 60 * 1000);
          const meta = classifyEvent(event.title || "");
          const startsToday = event.start >= todayStart && event.start < tomorrowStart;
          const overlapsToday = end > todayStart && event.start < tomorrowStart;
          const stillRelevant = end >= now;

          if (overlapsToday) todays.push({ event, end, meta });
          if (!startsToday && stillRelevant) future.push({ event, end, meta });
          if (meta.category === "sports" && stillRelevant) games.push({ event, end, meta });
        }

        todays.sort((a, b) => a.event.start - b.event.start);
        future.sort((a, b) => a.event.start - b.event.start);
        games.sort((a, b) => a.event.start - b.event.start);

        const nextUp = [];
        for (const item of todays) {
          if (item.end < now) continue;
          nextUp.push(sidebarItem(item));
          if (nextUp.length >= 6) break;
        }
        for (const item of future) {
          if (nextUp.length >= 6) break;
          nextUp.push(sidebarItem(item, true));
        }

        const gameItems = games.slice(0, 3).map(item => sidebarItem(item, true));
        const remainingToday = todays.filter(item => item.end >= now).length;
        const nextGame = games.find(item => item.event.start >= now);
        const nextGameText = nextGame ? `${nextGame.meta.icon ? nextGame.meta.icon + " " : ""}${humanWhen(nextGame.event.start)}` : "none soon";

        if (els.todaySummary) {
          els.todaySummary.textContent = `${remainingToday} remaining today • next game ${nextGameText}`;
        }

        renderSideList(els.todayUpcoming, nextUp, "Nothing scheduled");
        renderSideList(els.todayGames, gameItems, "No games soon");
      }

      function sidebarItem(item, includeDate = false) {
        const event = item.event;
        const meta = item.meta;
        const prefix = meta.icon ? `${meta.icon} ` : "";
        const when = event.allDay
          ? "All day"
          : includeDate
            ? `${formatPrettyDate(event.start)} ${formatTime(event.start)}`
            : formatTime(event.start);

        return {
          category: meta.category,
          line1: `${prefix}${event.title}`,
          line2: `${when} • ${humanWhen(event.start)}`
        };
      }

      function parseMenuTitleParts(title) {
        const cleaned = String(title || "").trim();
        const parts = cleaned.split("— Sides:");
        const left = (parts[0] || "").trim();
        const sides = (parts[1] || "").trim();
        const colon = left.indexOf(":");
        const menuText = colon >= 0 ? left.slice(colon + 1).trim() : left;
        const items = menuText.split(" / ").map(s => s.trim()).filter(Boolean);
        return { items, sides };
      }

      function shouldShowMealsFooter(mealsByDate) {
        if (!AUTO_HIDE_MEALS_FOOTER) return true;
        const today = new Date();
        const dow = today.getDay();
        if (dow === 0 || dow === 6) return false;
        const info = mealsByDate[toYYYYMMDD(today)];
        if (!info) return false;
        return Boolean(info.breakfastItems.length || info.lunchEntrees.length || info.lunchSides);
      }

      function setMealsFooterVisible(visible) {
        if (els.mealsFooter) els.mealsFooter.classList.toggle("hidden", !visible);
      }

      function renderMealsFooter(weekStart, mealsByDate) {
        if (!els.mealsGrid) return;
        els.mealsGrid.innerHTML = "";

        for (let i = 0; i < 7; i++) {
          const key = toYYYYMMDD(addDays(weekStart, i));
          const info = mealsByDate[key] || { breakfastItems: [], lunchEntrees: [], lunchSides: "" };
          const hasAny = Boolean(info.breakfastItems.length || info.lunchEntrees.length || info.lunchSides);
          const col = document.createElement("div");
          col.className = `meal-col${hasAny ? "" : " empty"}`;

          if (info.breakfastItems.length) {
            col.insertAdjacentHTML("beforeend", `
              <div class="meal-row">
                <span class="meal-pill">🍳</span>
                <span class="meal-main">${escapeHtml(info.breakfastItems.join(" / "))}</span>
              </div>`);
          }

          if (info.lunchEntrees.length || info.lunchSides) {
            col.insertAdjacentHTML("beforeend", `
              <div class="meal-row">
                <span class="meal-pill">🥪</span>
                <span class="meal-lunch">
                  <span class="meal-entrees">${escapeHtml(info.lunchEntrees.join(" / "))}</span>
                  <span class="meal-sides">${info.lunchSides ? "Sides: " + escapeHtml(info.lunchSides) : ""}</span>
                </span>
              </div>`);
          }

          els.mealsGrid.appendChild(col);
        }

        scheduleMealsLock();
      }

      function lockMealsGridToCalendarColumns() {
        if (!els.mealsGrid || !els.calendar || !els.mealsFooter || els.mealsFooter.classList.contains("hidden")) return;
        const headerCells = els.calendar.querySelectorAll(".fc-col-header-cell");
        if (!headerCells || headerCells.length < 7) return;
        const widths = Array.from(headerCells).slice(0, 7).map(cell => Math.round(cell.getBoundingClientRect().width));
        if (widths.every(width => width > 0)) {
          els.mealsGrid.style.gridTemplateColumns = widths.map(width => `${width}px`).join(" ");
        }
      }

      function scheduleMealsLock() {
        requestAnimationFrame(() => requestAnimationFrame(lockMealsGridToCalendarColumns));
      }

      async function fetchMealsForCurrentWeek() {
        const weekStart = startOfCurrentWeekSunday(new Date());
        const weekEnd = addDays(weekStart, 7);
        const url = `${MENU_URL}?start=${encodeURIComponent(toYYYYMMDD(weekStart))}&end=${encodeURIComponent(toYYYYMMDD(weekEnd))}`;
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(`Meals HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("Meals feed did not return an array");

        const byDate = {};
        for (const event of data) {
          const key = menuDateKey(event && event.start);
          const meal = event && event.extendedProps && event.extendedProps.meal;
          if (!key || (meal !== "breakfast" && meal !== "lunch")) continue;

          const parsed = parseMenuTitleParts(event.title);
          if (!byDate[key]) byDate[key] = { breakfastItems: [], lunchEntrees: [], lunchSides: "" };

          if (meal === "breakfast") {
            byDate[key].breakfastItems = parsed.items.slice(0, BREAKFAST_MAX_ITEMS);
          } else {
            byDate[key].lunchEntrees = parsed.items.slice(0, LUNCH_MAX_ENTREES);
            byDate[key].lunchSides = parsed.sides || "";
          }
        }

        setMealsFooterVisible(shouldShowMealsFooter(byDate));
        renderMealsFooter(weekStart, byDate);
      }

      function weatherCodeToEmoji(code, isDay = true) {
        const c = Number(code);
        if (c === 0) return isDay ? "☀️" : "🌙";
        if ([1, 2].includes(c)) return isDay ? "🌤️" : "☁️";
        if (c === 3) return "☁️";
        if ([45, 48].includes(c)) return "🌫️";
        if ([51, 53, 55, 56, 57].includes(c)) return "🌦️";
        if ([61, 63, 65, 66, 67, 80, 81, 82].includes(c)) return "🌧️";
        if ([71, 73, 75, 77, 85, 86].includes(c)) return "❄️";
        if ([95, 96, 99].includes(c)) return "⛈️";
        return "☁️";
      }

      function weatherCodeToText(code) {
        const labels = {
          0: "Clear",
          1: "Mainly clear",
          2: "Partly cloudy",
          3: "Overcast",
          45: "Fog",
          48: "Rime fog",
          51: "Light drizzle",
          53: "Drizzle",
          55: "Dense drizzle",
          56: "Freezing drizzle",
          57: "Freezing drizzle",
          61: "Light rain",
          63: "Rain",
          65: "Heavy rain",
          66: "Freezing rain",
          67: "Freezing rain",
          71: "Light snow",
          73: "Snow",
          75: "Heavy snow",
          77: "Snow grains",
          80: "Rain showers",
          81: "Rain showers",
          82: "Violent showers",
          85: "Snow showers",
          86: "Snow showers",
          95: "Thunderstorm",
          96: "Thunderstorm hail",
          99: "Thunderstorm hail"
        };
        return labels[Number(code)] || "Weather";
      }

      async function loadWeather() {
        const url =
          `https://api.open-meteo.com/v1/forecast` +
          `?latitude=${HOME_LAT}&longitude=${HOME_LON}` +
          `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,is_day` +
          `&hourly=temperature_2m,weather_code` +
          `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,sunrise,sunset` +
          `&temperature_unit=fahrenheit&windspeed_unit=mph&precipitation_unit=inch` +
          `&timezone=auto&forecast_days=5`;

        try {
          const response = await fetch(url, { cache: "no-store" });
          if (!response.ok) throw new Error(`Weather HTTP ${response.status}`);
          const data = await response.json();
          renderWeather(data);
        } catch (err) {
          document.getElementById("weather-cond").textContent = "Weather unavailable";
          document.getElementById("weather-updated").textContent = err && err.message ? err.message : "Error";
        }
      }

      function renderWeather(data) {
        const current = data.current || {};
        const hourly = data.hourly || {};
        const daily = data.daily || {};
        const currentCode = current.weather_code;
        const isDay = current.is_day !== 0;
        const temp = Math.round(current.temperature_2m);
        const feels = Math.round(current.apparent_temperature);
        const wind = Math.round(current.wind_speed_10m);
        const pop = daily.precipitation_probability_max && daily.precipitation_probability_max[0];
        const hi = daily.temperature_2m_max && Math.round(daily.temperature_2m_max[0]);
        const lo = daily.temperature_2m_min && Math.round(daily.temperature_2m_min[0]);

        document.getElementById("weather-temp").textContent = Number.isFinite(temp) ? `${temp}°` : "--°";
        document.getElementById("weather-icon").textContent = weatherCodeToEmoji(currentCode, isDay);
        document.getElementById("weather-cond").textContent = weatherCodeToText(currentCode);
        document.getElementById("weather-hilo").textContent = `H:${Number.isFinite(hi) ? hi : "--"}° L:${Number.isFinite(lo) ? lo : "--"}°`;
        document.getElementById("weather-feels").textContent = Number.isFinite(feels) ? `Feels ${feels}°` : "Feels —";
        document.getElementById("weather-wind").textContent = Number.isFinite(wind) ? `Wind ${wind} mph` : "Wind —";
        document.getElementById("weather-precip").textContent = pop != null ? `Precip ${Math.round(pop)}%` : "Precip —";
        document.getElementById("weather-updated").textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;

        renderHourly(hourly);
        renderDaily(daily);
      }

      function renderHourly(hourly) {
        const container = document.getElementById("weather-hourly");
        container.innerHTML = "";
        const times = hourly.time || [];
        const temps = hourly.temperature_2m || [];
        const codes = hourly.weather_code || [];
        const now = new Date();
        let startIdx = times.findIndex(time => new Date(time) >= now);
        if (startIdx < 0) startIdx = 0;

        for (let slot = 0; slot < 6; slot++) {
          const idx = startIdx + slot * 2;
          if (idx >= times.length) break;
          const dt = new Date(times[idx]);
          const temp = Math.round(temps[idx]);
          container.insertAdjacentHTML("beforeend", `
            <div class="wx-hour">
              <div class="time">${escapeHtml(dt.toLocaleTimeString([], { hour: "numeric" }))}</div>
              <div class="icon">${weatherCodeToEmoji(codes[idx], true)}</div>
              <div class="temp">${Number.isFinite(temp) ? temp : "--"}°</div>
            </div>`);
        }
      }

      function renderDaily(daily) {
        const container = document.getElementById("weather-forecast");
        container.innerHTML = "";
        const days = daily.time || [];
        const highs = daily.temperature_2m_max || [];
        const lows = daily.temperature_2m_min || [];
        const codes = daily.weather_code || [];
        const validTemps = highs.concat(lows).filter(n => Number.isFinite(Number(n))).map(Number);
        const minAll = validTemps.length ? Math.min(...validTemps) : 0;
        const maxAll = validTemps.length ? Math.max(...validTemps) : 1;
        const span = Math.max(1, maxAll - minAll);

        for (let i = 0; i < Math.min(5, days.length); i++) {
          const dt = new Date(`${days[i]}T00:00:00`);
          const low = Math.round(lows[i]);
          const high = Math.round(highs[i]);
          const hasRange = Number.isFinite(low) && Number.isFinite(high);
          const left = hasRange ? Math.max(0, Math.min(92, ((low - minAll) / span) * 82)) : 0;
          const width = hasRange ? Math.max(10, Math.min(96 - left, ((high - low) / span) * 82 + 10)) : 0;
          container.insertAdjacentHTML("beforeend", `
            <div class="wx-day">
              <div class="day">${escapeHtml(dt.toLocaleDateString([], { weekday: "short" }))}</div>
              <div class="icon">${weatherCodeToEmoji(codes[i], true)}</div>
              <div class="wx-range">
                <span class="wx-low">${Number.isFinite(low) ? low : "--"}°</span>
                <span class="wx-bar"><span class="wx-fill" style="left:${left}%;width:${width}%;"></span></span>
                <span class="wx-high">${Number.isFinite(high) ? high : "--"}°</span>
              </div>
            </div>`);
        }
      }

      const calendar = new FullCalendar.Calendar(els.calendar, {
        initialView: "rolling4Weeks",
        views: {
          rolling4Weeks: { type: "dayGrid", duration: { weeks: 4 } }
        },
        firstDay: 0,
        height: "100%",
        expandRows: true,
        fixedWeekCount: false,
        showNonCurrentDates: false,
        dayMaxEvents: true,
        dayMaxEventRows: 4,
        eventMinHeight: 18,
        headerToolbar: { left: "", center: "title", right: "" },
        visibleRange(currentDate) {
          const start = startOfCurrentWeekSunday(currentDate);
          return { start, end: addDays(start, 28) };
        },
        eventSources: [
          { url: ICS_URL, format: "ics" }
        ],
        dayCellDidMount(info) {
          const date = startOfDay(info.date);
          const label = holidayLabelForDate(date);
          if (label) {
            info.el.classList.add("holiday-date");
            info.el.setAttribute("data-holiday-label", label);
          }
          ensureDayChip(info.el, toYYYYMMDD(date));
        },
        eventClassNames(arg) {
          return [`event-${classifyEvent(arg.event.title || "").category}`];
        },
        eventDidMount(arg) {
          if (arg.event.allDay || !arg.event.start) return;
          const now = new Date();
          const end = arg.event.end || new Date(arg.event.start.getTime() + 60 * 60 * 1000);
          if (sameDay(arg.event.start, now) && end < now) {
            arg.el.classList.add("evt-past-today");
          }
        },
        eventContent(arg) {
          const title = arg.event.title || "";
          const meta = classifyEvent(title);
          const parts = [];
          if (meta.icon) parts.push(`<span class="evt-icon">${meta.icon}</span>`);
          if (!arg.event.allDay && arg.timeText) parts.push(`<span class="evt-time">${escapeHtml(arg.timeText)}</span>`);
          parts.push(`<span class="evt-title">${escapeHtml(title)}</span>`);
          return { html: `<span class="evt">${parts.join("")}</span>` };
        },
        eventsSet(events) {
          cachedSportsEvents = normalizeSportsEvents(events);
          if (calendar.view) updateGameDayChips(calendar.view.currentStart, calendar.view.currentEnd);
          buildSidebar(calendar);
          scheduleMealsLock();
        },
        datesSet(info) {
          updateChristmasChip();
          updateGameDayChips(info.start, info.end);
          buildSidebar(calendar);
          scheduleMealsLock();
        }
      });

      calendar.render();
      updateChristmasChip();
      scheduleMealsLock();

      fetchMealsForCurrentWeek().catch(err => {
        console.warn("Meals error:", err);
        setMealsFooterVisible(true);
        renderMealsFooter(startOfCurrentWeekSunday(new Date()), {});
      });

      loadWeather();

      window.addEventListener("resize", scheduleMealsLock);

      setInterval(() => {
        updateChristmasChip();
        if (calendar.view) updateGameDayChips(calendar.view.currentStart, calendar.view.currentEnd);
        buildSidebar(calendar);
      }, 1000);

      setInterval(() => {
        setLastRefreshed("auto");
        calendar.refetchEvents();
        fetchMealsForCurrentWeek().catch(err => console.warn("Meals refresh error:", err));
      }, AUTO_REFRESH_MINUTES * 60 * 1000);

      setInterval(loadWeather, WEATHER_REFRESH_MINUTES * 60 * 1000);
    });
  </script>
</body>
</html>
